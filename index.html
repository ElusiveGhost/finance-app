<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой финансовый помощник</title>
    <link rel="stylesheet" href="styles.css">
        <!-- Подключение библиотеки стилей для красивых уведомлений -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Подключение библиотеки для выбора дат -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
</head>
<body>
    <!-- Экран блокировки (PIN-код) -->
    <div id="lock" class="lock-screen">
        <h2>Введите PIN-код</h2>
        <input type="password" id="pin-input">
        <button id="pin-btn">Войти</button>
    </div>

           <!-- Само приложение (скрыто по умолчанию) -->
    <div id="app" class="hidden">
        <header class="top-bar">
            <h1>Финансы</h1>
        </header>

        <!-- Меню теперь здесь -->
        <nav class="top-nav"> 
            <button>Доходы</button>
            <button>Расходы</button>
            <button>Отчёт</button>
            <button>Планер</button>
        </nav>

        <main id="main-content">
            <!-- Сюда будут загружаться вкладки -->
            <p>Добро пожаловать!</p>
        </main>
    </div>

    <!-- Подключаем наш скрипт (пока его нет, создадим дальше) -->
    <script src="app.js"></script>
        <!-- Подключение скрипта для красивых уведомлений -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Подключение скрипта для диаграмм -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Подключение скрипта для календаря -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    
    <!-- Наш основной скрипт -->
    <script src="app.js"></script>
</body>
</html>
